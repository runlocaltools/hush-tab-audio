<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hush</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
<div class="wrap">
  <div class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="#fff"><path d="M5 12h5l7-6v20l-7-6H5z"/><path d="M20 11.5a6 6 0 0 1 0 9M23.5 8a11 11 0 0 1 0 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <b>Hush</b>
    </div>
    <span id="statePill" class="pill" role="status"></span>
  </div>

  <div id="fault" class="fault" role="alert" hidden>
    <b data-i18n="faultTitle"></b><span data-i18n="faultBody"></span><span id="faultDetail" class="detail"></span>
  </div>

  <div id="tip" class="tip" hidden>
    <span id="tipText"></span>
    <button id="tipClose" class="x" type="button" data-i18n-aria="dismiss">×</button>
  </div>

  <div class="actions">
    <button id="btnSolo" class="action" type="button" aria-pressed="false">
      <b data-i18n="muteOthers"></b><span data-i18n="muteOthersSub"></span><kbd id="kSolo"></kbd>
    </button>
    <button id="btnAll" class="action" type="button" aria-pressed="false">
      <b data-i18n="muteAll"></b><span data-i18n="muteAllSub"></span><kbd id="kAll"></kbd>
    </button>
  </div>

  <div class="card">
    <label class="toggle">
      <span><b data-i18n="autoFollow"></b><small data-i18n="autoFollowSub"></small></span>
      <span class="switch"><input type="checkbox" id="swFollow"><i></i></span>
    </label>
    <p id="followNote" class="note" data-i18n="followNote" hidden></p>
    <label class="toggle">
      <span><b data-i18n="pause"></b><small data-i18n="pauseSub"></small></span>
      <span class="switch"><input type="checkbox" id="swPause"><i></i></span>
    </label>
  </div>

  <div class="list">
    <h2 data-i18n="playingNow"></h2>
    <ul id="playing" class="rows"></ul>
    <p id="playingEmpty" class="empty" data-i18n="nothingPlaying"></p>
    <h2 id="recentHead" class="later" data-i18n="recentlyPlayed" hidden></h2>
    <ul id="recent" class="rows"></ul>
  </div>

  <div id="permCard" class="card perm" hidden>
    <b data-i18n="permTitle"></b>
    <p data-i18n="permBody"></p>
    <button id="grantTabs" class="btn primary" type="button" data-i18n="permButton"></button>
  </div>

  <div class="foot">
    <button id="restore" class="btn" type="button" data-i18n="restoreAll"></button>
    <button id="openSettings" class="btn link" type="button" data-i18n="settings"></button>
  </div>
  <p class="lock" data-i18n="privacyLine"></p>
</div>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
